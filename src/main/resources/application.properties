spring.application.name=mool-backend
server.port=${PORT:8080}

# Falls back to local H2 file DB when no env vars are set (local dev).
# On Render, set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD to your
# Supabase Postgres connection details and this switches automatically.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mooldb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Frontend origin allowed to call this API. Set FRONTEND_URL on Render
# once you have your Vercel URL. Localhost still works for local dev.
app.frontend-url=${FRONTEND_URL:http://localhost:3001}
